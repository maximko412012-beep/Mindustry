name: Build Mindustry APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Для Mindustry критически важны подмодули, если они используются

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew android:assembleRelease
        # Для Mindustry обычно используется задача android:assembleRelease или android:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-APK
          path: |
            android/build/outputs/apk/release/*.apk
            android/build/outputs/apk/debug/*.apk
            
