name: Build Android APK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25

    - name: Set env
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
        else
          TAG_NAME="build-$(date +'%Y.%m.%d-%H%M')"
        fi
        echo "RELEASE_VERSION=${TAG_NAME}" >> $GITHUB_ENV
        echo "RELEASE_TAG=${TAG_NAME}" >> $GITHUB_ENV

    - name: Generate keystore automatically
      run: |
        keytool -genkeypair -v \
          -keystore bekeystore.jks \
          -alias frog \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "mindustrypassword" \
          -keypass "mindustrypassword" \
          -dname "CN=Mindustry, OU=Dev, O=Mindustry, L=Unknown, S=Unknown, C=US"

    - name: Create Android APK
      env:
        keystore_password: mindustrypassword
        keystore_alias_password: mindustrypassword
        keystore_alias: frog
      run: |
        git clone --depth=1 --branch=v9 https://github.com/Anuken/Mindustry
        cd Mindustry
        echo "BODY=$(git rev-parse HEAD)" >> $GITHUB_ENV
        sed -i 's/applicationId "io.anuke.mindustry"/applicationId "io.anuke.mindustry.be"/g' android/build.gradle.kts
        sed -i 's/"io.anuke.mindustry"/"io.anuke.mindustry.be"/g' android/AndroidManifest.xml
        sed -i 's/Mindustry/Mindustry BE/g' android/res/values/strings.xml
        ./gradlew pack
        ./gradlew android:assembleRelease -Pbuildversion=${RELEASE_VERSION} -PversionType=bleeding-edge -PshowCommitHash --stacktrace
        mv android/build/outputs/apk/release/android-release.apk android/build/outputs/apk/release/Mindustry-BE-Android-${RELEASE_VERSION}.apk

    - name: Upload Android artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Mindustry/android/build/outputs/apk/release/Mindustry-BE-Android-${{ env.RELEASE_TAG }}.apk
        tag: ${{ env.RELEASE_TAG }}
        release_name: "Build ${{ env.RELEASE_VERSION }}"
        body: ${{ env.BODY }}
        
